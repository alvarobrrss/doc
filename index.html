<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title></title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" type="image/x-icon" href="vhs.ico" />
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-WJSFRMBW0E"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-WJSFRMBW0E');
  </script>
</head>
<body>
  <video class="background-video" autoplay muted loop playsinline webkit-playsinline>
    <source src="videofondov3.mp4" type="video/mp4" />
  </video>
  <main class="main-wrapper">
    <div class="countdown">
      <div class="countdown-item">
        <span class="number" id="days">000</span>
        <span class="label">días</span>
      </div>
      <div class="countdown-item">
        <span class="number" id="hours">00</span>
        <span class="label">horas</span>
      </div>
      <div class="countdown-item">
        <span class="number" id="minutes">00</span>
        <span class="label">minutos</span>
      </div>
      <div class="countdown-item">
        <span class="number" id="seconds">00</span>
        <span class="label">segundos</span>
      </div>
    </div>
    <div class="nav-buttons">
      <a href="https://drive.google.com/drive/folders/1IvfQD8fPPsdCdAaregGaCvJPPaHwlUyY?usp=drive_link" target="_blank" class="nav-button">Aquí puedes aportar fotos y/o vídeos para el documental</a>
    </div>
  </main>
  <div class="grain"></div>
  <script src="script.js"></script>
</body>
</html>
