<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subida de Archivos</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/x-icon" href="vhs.ico">

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "TU_API_KEY",
      authDomain: "TU_PROYECTO.firebaseapp.com",
      projectId: "TU_PROYECTO",
      storageBucket: "TU_PROYECTO.appspot.com",
      messagingSenderId: "TU_SENDER_ID",
      appId: "TU_APP_ID"
    };

    firebase.initializeApp(firebaseConfig);

    firebase.auth().signInAnonymously()
      .then(() => console.log("Usuario anónimo autenticado"))
      .catch(error => console.error("Error en autenticación anónima:", error));
  </script>
</head>
<body>
  <audio id="background-music" src="musiquilla.mp3" autoplay loop></audio>

  <div class="border"></div>
  <div class="background"></div>
  <div class="grain"></div>
  <div class="slideshow"></div>

  <a href="https://www.youtube.com/watch?v=r5LPEGYdo0M" target="_blank" class="clock-link">
    <div class="clock">01/01/1970</div>
  </a>

  <!-- Formulario de Subida -->
  <form id="upload-form">
    <input type="text" id="nombre" placeholder="Nombre y Apellidos" required>
    <input type="email" id="correo" placeholder="Correo (opcional)">
    <input type="tel" id="telefono" placeholder="Teléfono (opcional)">

    <p>Al subir archivos, confirmo que tengo los derechos para compartirlos y autorizo su posible uso en el documental.</p>

    <input type="file" id="fileInput" accept="image/*,video/*" required>
    <button type="submit">Subir Archivo</button>
  </form>

  <p id="upload-status"></p>

  <script src="script.js"></script>
</body>
</html>
