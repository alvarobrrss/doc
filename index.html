  <style>
    @font-face {
      font-family: '29LT Makina';
      src: url('./29lt-makina-regular.otf') format('opentype');
      font-display: swap;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; min-height: 100%;
      background: #000;
      overflow-x: hidden;
      font-family: '29LT Makina', monospace;
      color: #fff;
      user-select: none; -webkit-user-select: none;
    }
    #lienzo {
      position: fixed; inset: 0;
      width: 100vw; height: 100vh;
      z-index: 0;
      filter: sepia(.22) contrast(1.05) brightness(.8) saturate(.9);
    }
    #lienzo.kb { animation: kenburns 18s ease-in-out forwards; }
    @keyframes kenburns {
      0%   { transform: scale(1.03); }
      100% { transform: scale(1.1); }
    }
    .velo {
      position: fixed; inset: 0; z-index: 1; pointer-events: none;
      background:
        radial-gradient(ellipse at center, rgba(0,0,0,.28) 0%, rgba(0,0,0,.74) 100%),
        linear-gradient(180deg, rgba(0,0,0,.35) 0%, transparent 25%, transparent 70%, rgba(0,0,0,.55) 100%);
    }
    #grano {
      position: fixed; inset: 0;
      width: 100vw; height: 100vh;
      z-index: 2; pointer-events: none;
      opacity: .26;
      mix-blend-mode: overlay;
    }
    .main-wrapper {
      position: relative; z-index: 10;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      min-height: 100vh; min-height: 100dvh; width: 100vw;
      padding: 20px 20px 160px;
      text-align: center;
    }

    /* --- Mensaje del estreno --- */
    .post-estreno {
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 720px;
      margin-top: clamp(30px, 6vh, 70px);
    }
    .mensaje {
      font-size: clamp(.95em, 2vw, 1.15em);
      line-height: 1.8;
      letter-spacing: .01em;
      color: rgba(255,255,255,.92);
      text-shadow: 0 2px 20px rgba(0,0,0,.85);
    }
    .mensaje .firma { display: block; margin-top: 1.4em; opacity: .85; }

    .ya-disponible {
      display: inline-flex; align-items: center; justify-content: center;
      font-family: '29LT Makina', monospace;
      font-size: clamp(1em, 2.6vw, 1.5em);
      letter-spacing: .3em;
      text-indent: .3em;
      text-transform: uppercase;
      color: #fff;
      border: 1px solid rgba(255,255,255,.85);
      padding: 16px 42px;
      margin: clamp(30px, 6vh, 60px) 0 0;
      background: rgba(0,0,0,.32);
      backdrop-filter: blur(3px);
      cursor: default;
    }
    .nota-disponible {
      display: block;
      margin-top: 12px;
      font-size: clamp(.55em, 1.3vw, .7em);
      letter-spacing: .15em;
      text-transform: uppercase;
      color: rgba(255,255,255,.55);
      text-shadow: 0 2px 14px rgba(0,0,0,.8);
    }

    .trailer-btn {
      display: inline-flex; align-items: center; gap: 9px;
      font-family: '29LT Makina', monospace;
      font-size: clamp(.6em, 1.3vw, .8em);
      letter-spacing: .25em;
      text-indent: .25em;
      text-transform: uppercase;
      color: #fff;
      text-decoration: none;
      border: 1px solid rgba(255,255,255,.75);
      padding: 9px 20px;
      margin-top: clamp(30px, 6vh, 64px);
      background: rgba(0,0,0,.28);
      backdrop-filter: blur(3px);
      transition: background .35s ease, color .35s ease, box-shadow .35s ease, transform .35s ease;
    }
    .trailer-btn.secundario {
      margin-top: 18px;
      font-size: clamp(.55em, 1.1vw, .7em);
      padding: 8px 18px;
      opacity: .85;
    }
    .trailer-btn .play {
      width: 0; height: 0;
      border-top: 5px solid transparent;
      border-bottom: 5px solid transparent;
      border-left: 8px solid currentColor;
      transform: translateY(-1px);
    }
    .trailer-btn:hover, .trailer-btn:focus-visible {
      background: #fff; color: #000;
      box-shadow: 0 0 46px rgba(255,255,255,.35);
      transform: translateY(-2px);
      outline: none;
    }

    /* --- Galería del estreno --- */
    .galeria {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 10px;
      width: 100%;
      max-width: 1100px;
      margin: clamp(50px, 9vh, 100px) 0 0;
    }
    .foto {
      display: block;
      position: relative;
      aspect-ratio: 3 / 2;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.25);
      background: #000;
    }
    .foto img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      filter: sepia(.15) contrast(1.05) saturate(.95);
      transition: transform .6s ease, filter .6s ease;
    }
    .foto:hover img, .foto:focus-visible img {
      transform: scale(1.06);
      filter: none;
    }

    .bottom-image {
      position: fixed; bottom: 20px; left: 50%;
      transform: translateX(-50%);
      width: clamp(180px, 30vw, 360px); height: auto;
      z-index: 20; pointer-events: none;
      user-select: none; -webkit-user-select: none; -webkit-user-drag: none;
    }
    @media (max-width: 600px) {
      .galeria { grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
      .bottom-image { width: clamp(140px, 55vw, 240px); bottom: 14px; }
      .main-wrapper { padding-bottom: 130px; }
    }
    @media (prefers-reduced-motion: reduce) {
      #lienzo.kb { animation: none; }
    }
  </style>
</head>
<body>

  <div class="velo"></div>
  <canvas id="grano"></canvas>
  <main class="main-wrapper">

    <section class="galeria" aria-label="Fotos del estreno">

      <a class="foto" href="estreno/fotosnochedocumental (11).jpg" target="_blank" rel="noopener"><img src="estreno/fotosnochedocumental (11).jpg" alt="Ambiente del estreno del documental" loading="lazy"></a>
      <a class="foto" href="estreno/fotosnochedocumental (12).jpg" target="_blank" rel="noopener"><img src="estreno/fotosnochedocumental (12).jpg" alt="Público del estreno del documental" loading="lazy"></a>
      <a class="foto" href="estreno/fotosnochedocumental (13).jpg" target="_blank" rel="noopener"><img src="estreno/fotosnochedocumental (13).jpg" alt="Plaza llena durante el estreno" loading="lazy"></a>
    </section>

  </main>
  <img class="bottom-image" src="aunquedalomejor.png" alt="" draggable="false" onerror="this.style.display='none'" />
  <script>
  addEventListener('contextmenu', e => e.preventDefault());
  addEventListener('dragstart', e => e.preventDefault());
  (function(){
    const g = document.getElementById('grano');
    const gx = g.getContext('2d');
    let gw, gh;
    const tiles = [];
    for (let t = 0; t < 6; t++){
      const c = document.createElement('canvas');
      c.width = c.height = 160;
      const x = c.getContext('2d');
      const im = x.createImageData(160, 160);
      for (let i = 0; i < im.data.length; i += 4){
        const v = 90 + Math.random() * 130 | 0;
        im.data[i] = im.data[i+1] = im.data[i+2] = v;
        im.data[i+3] = Math.random() < 0.55 ? 255 : 0;
      }
      x.putImageData(im, 0, 0);
      tiles.push(c);
    }
    function gsize(){
      gw = g.width = Math.round(innerWidth / 2);
      gh = g.height = Math.round(innerHeight / 2);
    }
    gsize();
    addEventListener('resize', gsize);
    const quieto = matchMedia('(prefers-reduced-motion: reduce)').matches;
    let last = 0;
    function granoPaso(t){
      if (!quieto && t - last > 33){
        last = t;
        gx.clearRect(0, 0, gw, gh);
        gx.fillStyle = gx.createPattern(tiles[Math.random() * tiles.length | 0], 'repeat');
        gx.save();
        gx.translate(-(Math.random() * 60 | 0), -(Math.random() * 60 | 0));
        gx.fillRect(0, 0, gw + 60, gh + 60);
        gx.restore();
      }
      requestAnimationFrame(granoPaso);
    }
    requestAnimationFrame(granoPaso);
  })();
  const NF = 28, NV = 18;
  const ITEMS = [];
  for (let i = 1; i <= NF; i++) ITEMS.push({ t: 'f', src: 'web/f' + String(i).padStart(2,'0') + '.jpg' });
  for (let i = 1; i <= NV; i++) ITEMS.push({ t: 'v', src: 'web/v' + String(i).padStart(2,'0') + '.mp4' });
  for (let i = ITEMS.length - 1; i > 0; i--){
    const j = Math.random() * (i + 1) | 0;
    [ITEMS[i], ITEMS[j]] = [ITEMS[j], ITEMS[i]];
  }
  const REVELADO = 4200;
  const REPOSO_F = 5800;
  const FUNDIDO  = 1300;
  const cv = document.getElementById('lienzo');
  const ctx = cv.getContext('2d');
  let W, H;
  function resize(){
    const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    W = cv.width  = Math.round(innerWidth  * dpr);
    H = cv.height = Math.round(innerHeight * dpr);
  }
  resize();
  addEventListener('resize', resize);
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const ahorro = navigator.connection && navigator.connection.saveData;
  function mkVideo(){
    const v = document.createElement('video');
    v.muted = true;
    v.playsInline = true;
    v.setAttribute('playsinline', '');
    v.preload = 'auto';
    v.loop = false;
    return v;
  }
  function cargar(item, v){
    return new Promise(res => {
      if (item.t === 'f'){
        const im = new Image();
        im.onload = () => res(im);
        im.onerror = () => res(null);
        im.src = item.src;
      } else {
        let listo = false;
        const ok = () => { if (!listo){ listo = true; res(v); } };
        v.oncanplaythrough = ok;
        v.onloadeddata = ok;
        v.onerror = () => res(null);
        v.src = item.src;
        v.load();
        setTimeout(() => res(null), 15000);
      }
    });
  }
  function medidas(m){
    return m.videoWidth ? [m.videoWidth, m.videoHeight] : [m.naturalWidth || m.width, m.naturalHeight || m.height];
  }
  function dibujar(m, alpha){
    const [mw, mh] = medidas(m);
    if (!mw) return;
    const r = Math.max(W / mw, H / mh);
    if (alpha !== undefined) ctx.globalAlpha = alpha;
    ctx.drawImage(m, (W - mw * r) / 2, (H - mh * r) / 2, mw * r, mh * r);
    ctx.globalAlpha = 1;
  }
  function espera(ms){ return new Promise(r => setTimeout(r, ms)); }
  function pintar(m){
    return new Promise(res => {
      const mascara = document.createElement('canvas');
      mascara.width = W; mascara.height = H;
      const mctx = mascara.getContext('2d');
      const t0 = performance.now();
      const nB = 8;
      const bandas = [];
      for (let i = 0; i < nB; i++){
        bandas.push({
          y: ((i + 0.5) / nB) * H + (Math.random() - 0.5) * H / nB * 0.5,
          dir: i % 2 ? -1 : 1,
          ini: i * REVELADO * 0.085,
          dur: REVELADO * 0.38,
          onda: 2 + Math.random() * 3,
          fase: Math.random() * Math.PI * 2,
          prev: null
        });
      }
      const rB = (H / nB) * 0.85;
      (function paso(t){
        const p = Math.min((t - t0) / REVELADO, 1);
        const rel = t - t0;
        for (const b of bandas){
          const q = (rel - b.ini) / b.dur;
          if (q <= 0 || b.prev === 'fin') continue;
          const qq = Math.min(q, 1);
          const suave = qq * qq * (3 - 2 * qq);
          const x = b.dir > 0 ? -0.12 * W + 1.24 * W * suave : 1.12 * W - 1.24 * W * suave;
          const desde = (b.prev === null) ? x : b.prev;
          const pasos = Math.max(1, Math.round(Math.abs(x - desde) / (rB * 0.5)));
          for (let s = 0; s <= pasos; s++){
            const xx = desde + (x - desde) * (s / pasos);
            const yy = b.y + Math.sin(xx / W * Math.PI * b.onda + b.fase) * rB * 0.35;
            const r = rB * (0.85 + Math.random() * 0.35);
            mctx.save();
            mctx.translate(xx, yy);
            mctx.scale(1.5, 1);
            const g = mctx.createRadialGradient(0, 0, 0, 0, 0, r);
            g.addColorStop(0, 'rgba(255,255,255,.85)');
            g.addColorStop(0.65, 'rgba(255,255,255,.45)');
            g.addColorStop(1, 'rgba(255,255,255,0)');
            mctx.fillStyle = g;
            mctx.beginPath();
            mctx.arc(0, 0, r, 0, Math.PI * 2);
            mctx.fill();
            mctx.restore();
          }
          b.prev = (qq >= 1) ? 'fin' : x;
        }
        if (p > 0.8){
          mctx.fillStyle = 'rgba(255,255,255,' + ((p - 0.8) / 0.2 * 0.25) + ')';
          mctx.fillRect(0, 0, W, H);
        }
        ctx.clearRect(0, 0, W, H);
        ctx.drawImage(mascara, 0, 0);
        ctx.globalCompositeOperation = 'source-in';
        dibujar(m);
        ctx.globalCompositeOperation = 'source-over';
        if (p < 1) requestAnimationFrame(paso); else res();
      })(t0);
    });
  }
  function mostrar(m, ms){
    return new Promise(res => {
      const t0 = performance.now();
      (function paso(t){
        ctx.clearRect(0, 0, W, H);
        dibujar(m);
        if (t - t0 < ms) requestAnimationFrame(paso); else res();
      })(t0);
    });
  }
  function hastaElFinal(v){
    return new Promise(res => {
      const tope = performance.now() + ((v.duration || 30) + 3) * 1000;
      (function paso(t){
        ctx.clearRect(0, 0, W, H);
        dibujar(v);
        if (!v.ended && t < tope) requestAnimationFrame(paso); else res();
      })(performance.now());
    });
  }
  function fundirEntrada(m, ms){
    return new Promise(res => {
      const t0 = performance.now();
      (function paso(t){
        const p = Math.min((t - t0) / ms, 1);
        ctx.clearRect(0, 0, W, H);
        dibujar(m, p);
        if (p < 1) requestAnimationFrame(paso); else res();
      })(t0);
    });
  }
  function fundirANegro(m){
    return new Promise(res => {
      const t0 = performance.now();
      (function paso(t){
        const p = Math.min((t - t0) / FUNDIDO, 1);
        ctx.clearRect(0, 0, W, H);
        dibujar(m, 1 - p);
        if (p < 1) requestAnimationFrame(paso); else res();
      })(t0);
    });
  }
  async function ciclo(){
    if (ahorro || !ITEMS.length) return;
    let vA = mkVideo(), vB = mkVideo();
    let media = await cargar(ITEMS[0], vA);
    let i = 0;
    while (true){
      const sigItem = ITEMS[(i + 1) % ITEMS.length];
      const sigVideo = (media === vA) ? vB : vA;
      const precarga = cargar(sigItem, sigVideo);
      if (media){
        if (media.play){ try { await media.play(); } catch(e){} }
        cv.classList.remove('kb'); void cv.offsetWidth; cv.classList.add('kb');
        if (reduced) await fundirEntrada(media, 1200);
        else await pintar(media);
        if (media.play){
          if (media.ended) await mostrar(media, 800);
          else await hastaElFinal(media);
        } else {
          await mostrar(media, REPOSO_F);
        }
        await fundirANegro(media);
        if (media.pause) media.pause();
      } else {
        await espera(300);
      }
      const sig = await precarga;
      media = sig || media;
      i++;
    }
  }
  ciclo();
  </script>
