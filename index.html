      letter-spacing: .05em;
      line-height: 1;

      margin-bottom: -8px;
      text-shadow: 0 4px 30px rgba(0,0,0,.85);
      font-variant-numeric: tabular-nums;
    }
    .countdown-item .label {
      font-size: clamp(.8em, 2vw, 1.5em);

      border-bottom: 5px solid transparent;
      border-left: 8px solid currentColor;

      transform: translateY(-2px);

  function unidad(id, v, sing, plur){
    document.getElementById(id).textContent = v;
    document.getElementById(id + '-l').textContent = (v === 1 ? sing : plur);
  }
  function updateCountdown() {
    const diff = new Date('2026-08-15T00:00:00') - new Date();
    if (diff <= 0) return;
    unidad('days',    Math.floor(diff / 864e5),        'día',     'días');
    unidad('hours',   Math.floor(diff % 864e5 / 36e5), 'hora',    'horas');
    unidad('minutes', Math.floor(diff % 36e5 / 6e4),   'minuto',  'minutos');
    unidad('seconds', Math.floor(diff % 6e4 / 1e3),    'segundo', 'segundos');
  }
  updateCountdown();
  setInterval(updateCountdown, 1000);

      c.width = c.height = 160;

      const im = x.createImageData(160, 160);

        im.data[i] = im.data[i+1] = im.data[i+2] = v;
        im.data[i+3] = Math.random() < 0.55 ? 255 : 0;

      x.putImageData(im, 0, 0);
      tiles.push(c);

        gx.fillRect(0, 0, gw + 60, gh + 60);

      requestAnimationFrame(granoPaso);
    }

    return m.videoWidth ? [m.videoWidth, m.videoHeight] : [m.naturalWidth || m.width, m.naturalHeight || m.height];
